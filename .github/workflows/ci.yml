name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        id: node-cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Record Build 207 locked npm cache evidence
        env:
          ICAMP_CI_LANE: verify
          ICAMP_NPM_CACHE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
        run: node scripts/build207-cache-witness.mjs

      - name: Apply formatter in verification workspace
        run: npm exec prettier -- --write .

      - name: Verify formatter produced no changes
        id: formatting
        run: git diff --exit-code

      - name: Save formatter diff on failure
        if: failure() && steps.formatting.outcome == 'failure'
        run: git diff > prettier.diff

      - name: Upload formatter diff on failure
        if: failure() && steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: prettier-diff
          path: prettier.diff
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify telephone/SMS workflow parity harness
        run: npm run parity:verify

      - name: Verify Build 202 ephemeral signed TEST witness denials
        run: npm run build202:scoped-witness

      - name: Verify Build 203 nonproduction runbook remains NO-GO
        run: npm run build203:runbook

      - name: Verify Build 204 protected CI event and gate contract
        run: npm run build204:ci-contract

      - name: Verify Build 206 locked cache and required-gate safety
        run: npm run build206:cache-contract

      - name: Verify Build 207 warm-run and browser cache safety
        run: npm run build207:cache-contract

      - name: Verify Build 208 cold-runner diagnostics and protected gates
        run: npm run build208:ci-contract

      - name: Verify Build 209 cross-release monitoring and protected SLA contract
        run: npm run build209:ci-contract

      - name: Verify Build 210 reviewed history and protected queue diagnostics
        run: npm run build210:ci-contract

      - name: Verify Build 211 runner and artifact SLA evidence safety
        run: npm run build211:ci-contract

      - name: Verify Build 212 escalation custody and signed owner decision safety
        run: npm run build212:ci-contract

      - name: Verify Build 213 cohort source and offline custody proof safety
        run: npm run build213:ci-contract

      - name: Verify Build 214 external-registration and evidence-aging safety
        run: npm run build214:ci-contract

      - name: Verify Build 215 independent anchor and owner expiry safety
        run: npm run build215:ci-contract

      - name: Verify Build 216 checkpoint rotation and renewal review safety
        run: npm run build216:ci-contract

      - name: Verify Build 217 custody diversity and offline SLA dashboard safety
        run: npm run build217:ci-contract

      - name: Verify Build 218 owner-scoped source recheck and evidence portability safety
        run: npm run build218:ci-contract

      - name: Verify Build 219 separate runner and manifest signatures with fail-closed retention review
        run: npm run build219:ci-contract

      - name: Verify Build 220 original ZIP readback and independent offline closure safety
        run: npm run build220:ci-contract

      - name: Verify Build 221 independent provenance and retention review safety
        run: npm run build221:ci-contract

      - name: Build
        run: npm run build

      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Capture full dependency audit
        if: always()
        run: npm audit --json > npm-audit-full.json || true

      - name: Upload full dependency audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-full
          path: npm-audit-full.json
          retention-days: 3

      - name: Capture Build 205 historical CI queue and runtime evidence
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build205-ci-runtime-diagnostics.mjs

      - name: Upload Build 205 CI queue and runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build205-ci-runtime-evidence
          path: artifacts/build205-ci-runtime.json
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Browser end-to-end
    # Hold the browser image at Ubuntu 24.04 while investigating the Ubuntu
    # 26.04 apt mirror outlier observed in Build 207's main check.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_ENV: test
      ICAMP_APP_ENV: test
      ICAMP_APP_NAME: iCamp
      ICAMP_APP_VERSION: 0.1.0
      ICAMP_BUILD_SHA: ci-build-016
      ICAMP_RELEASE_ID: ci-build-016
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        id: node-cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Restore exact-lock Chromium browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ubuntu24.04-icamp-chromium-${{ hashFiles('package-lock.json') }}

      - name: Begin Build 208 Chromium install timing
        run: node scripts/build208-browser-runtime-diagnostics.mjs --start

      - name: Install Chromium
        id: chromium-install
        run: npx playwright install --with-deps chromium

      - name: Record Build 208 Chromium cold-runner timing
        if: always() && steps.chromium-install.outcome != 'skipped'
        env:
          ICAMP_CHROMIUM_INSTALL_OUTCOME: ${{ steps.chromium-install.outcome }}
          ICAMP_NPM_CACHE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
          ICAMP_BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
          ICAMP_BROWSER_CACHE_RESTORE_COMPLETED: ${{ steps.browser-cache.outcome == 'success' }}
        run: node scripts/build208-browser-runtime-diagnostics.mjs --finish

      - name: Upload Build 208 Chromium install timing evidence
        if: always() && steps.chromium-install.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: build208-chromium-install-evidence
          path: artifacts/build208-chromium-install.json
          if-no-files-found: error
          retention-days: 14

      - name: Record Build 207 installed Chromium and cache evidence
        env:
          ICAMP_CI_LANE: browser
          ICAMP_NPM_CACHE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
          ICAMP_BROWSER_CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
          ICAMP_BROWSER_CACHE_RESTORE_COMPLETED: ${{ steps.browser-cache.outcome == 'success' }}
        run: node scripts/build207-cache-witness.mjs --browser

      - name: Run browser end-to-end harness
        run: npm run e2e:test

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 3

  database:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: icamp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d icamp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/icamp_ci
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        id: node-cache
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Record Build 207 locked npm cache evidence
        env:
          ICAMP_CI_LANE: database
          ICAMP_NPM_CACHE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
        run: node scripts/build207-cache-witness.mjs

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply migrations
        run: node scripts/apply-database-migrations.mjs

      - name: Verify all database contracts
        run: npm run db:verify

      - name: Verify Build 187 incident closure, privacy RLS and immutable evidence
        run: npm run build187:verify

      - name: Verify Build 188 credential reconciliation, tenancy and immutable reviews
        run: npm run build188:verify

      - name: Verify Build 189 offline conflict dedupe, replay review and RLS
        run: npm run build189:verify

      - name: Verify Build 190 shift overlap, qualification, availability and handoff RLS
        run: npm run build190:verify

      - name: Verify Build 191 vendor SLA, confidential sources and independent invoice review
        run: npm run build191:verify

      - name: Verify Build 192 stock concurrency, POS sessions and independent count/till review
        run: npm run build192:verify

      - name: Verify Build 194 staff-only saved layouts, optimistic versions and campground RLS
        run: npm run build194:verify

      - name: Verify authentication lifecycle
        run: npm run auth:verify

      - name: Verify authorization lifecycle
        run: npm run authz:verify

      - name: Verify audit and privileged-action lifecycle
        run: npm run audit:verify

      - name: Verify background jobs and scheduler lifecycle
        run: npm run jobs:verify

      - name: Verify secure media and document lifecycle
        run: npm run media:verify

      - name: Verify omnichannel communications lifecycle
        run: npm run communications:verify

      - name: Verify inbound/outbound voice and IVR lifecycle
        run: npm run voice:verify

      - name: Verify numeric keypad and DTMF lifecycle
        run: npm run dtmf:verify

      - name: Verify SMS/MMS conversation and command lifecycle
        run: npm run messaging:verify

      - name: Verify telephone/SMS identity and staff re-authentication lifecycle
        run: npm run identity:verify

      - name: Verify messaging consent, STOP/START/HELP and preference ledger lifecycle
        run: npm run consent:verify

      - name: Re-run migrations to prove idempotent history handling
        run: node scripts/apply-database-migrations.mjs

      - name: Seed synthetic demo campground
        run: npm run demo:seed
        env:
          ICAMP_APP_ENV: test
          ICAMP_ALLOW_DEMO_SEED: "true"

      - name: Verify synthetic demo campground
        run: npm run demo:verify

      - name: Build 198 isolated backup and restore with tenant-isolation proof
        run: npm run build198:restore-drill
        env:
          ICAMP_APP_ENV: test
          ICAMP_DRILL_ACK: ISOLATED_TEST_ONLY

      - name: Build 198 synthetic scoped database performance budget
        run: npm run build198:db-budget
        env:
          ICAMP_APP_ENV: test
          ICAMP_DRILL_ACK: ISOLATED_TEST_ONLY

      - name: Build 200 guest/staff source inventory and nonactivation decision audit
        run: npm run build200:source-audit

      - name: Build 201 isolated synthetic handshake and production-denial security audit
        run: npm run build201:handshake-drill

      - name: Show migration history
        run: >-
          psql "$DATABASE_URL"
          -X
          --no-psqlrc
          --tuples-only
          --no-align
          -c "select version || ':' || name from icamp_meta.schema_migrations order by version;"
