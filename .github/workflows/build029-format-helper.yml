name: Build 029 formatter helper

on:
  push:
    branches:
      - build-029-operational-assets-fleet

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: build-029-operational-assets-fleet
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm exec prettier -- --write app/workspaces/management/campgrounds/assets/page.tsx lib/operational-assets/postgres.d.mts lib/operational-assets/postgres.mjs tests/build029-repository.test.mjs tests/build029-ui.test.mjs
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workspaces/management/campgrounds/assets/page.tsx lib/operational-assets/postgres.d.mts lib/operational-assets/postgres.mjs tests/build029-repository.test.mjs tests/build029-ui.test.mjs
          git commit -m "Build 029 — apply formatter"
          git push origin HEAD:build-029-operational-assets-fleet
