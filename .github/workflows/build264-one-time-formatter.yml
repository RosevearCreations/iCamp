name: iCamp Build 264 one-time formatter
on:
  push:
    branches:
      - release/icamp264-rental-allocation-pilot-sysop-contract
permissions:
  contents: write
jobs:
  release-format:
    if: contains(github.event.head_commit.message, '[format264]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Canonical Prettier
        run: npm exec prettier -- --write .
      - name: Commit formatting back to release
        run: |
          git add -u
          if git diff --cached --quiet; then echo "Already formatted"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format iCamp Build 264 using repository Prettier"
          git push origin HEAD:refs/heads/release/icamp264-rental-allocation-pilot-sysop-contract
