# One-time, owner-authorized release formatting helper. Remove before merge.
name: iCamp Build 262 one-time formatter
on:
  push:
    branches:
      - release/icamp262-custody-themes-rentals
permissions:
  contents: write
jobs:
  release-format:
    if: contains(github.event.head_commit.message, '[format262]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact release branch
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install trusted lockfile dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Apply repository formatter
        run: npm exec prettier -- --write .
      - name: Commit only formatting changes on release branch
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format iCamp Build 262 source with repository Prettier"
          git push origin HEAD:refs/heads/release/icamp262-custody-themes-rentals
