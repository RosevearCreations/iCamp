name: Build 193 One-Time Source Formatting
on:
  push:
    branches:
      - build193-seasonal-owner-queue
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install formatting tool
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Format Build 193 source
        run: |
          npx prettier --write app/workspaces/management/campgrounds/seasonal/owner-queue/actions.ts app/workspaces/management/campgrounds/seasonal/owner-queue/page.tsx app/workspaces/management/campgrounds/seasonal/page.tsx lib/seasonal-owner-queue/postgres.d.mts lib/seasonal-owner-queue/postgres.mjs tests/build193-owner-queue.test.mjs
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/workspaces/management/campgrounds/seasonal/owner-queue/actions.ts app/workspaces/management/campgrounds/seasonal/owner-queue/page.tsx app/workspaces/management/campgrounds/seasonal/page.tsx lib/seasonal-owner-queue/postgres.d.mts lib/seasonal-owner-queue/postgres.mjs tests/build193-owner-queue.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Build 193: normalize source formatting"
            git push origin HEAD:build193-seasonal-owner-queue
          fi
