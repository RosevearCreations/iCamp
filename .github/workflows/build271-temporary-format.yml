name: Build 271 temporary formatter
on:
  push:
    branches:
      - release/build271-original-proof-closure-dev-20261121
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'RosevearCreations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Normalize Build 271 exact changed files
        run: |
          npx prettier --write lib/build271/core.mjs lib/build271/postgres.mjs lib/build271/postgres.d.mts tests/build271-enrollment-closure-replay.test.mjs app/api/internal/source-proof271/route.ts app/sysop/enrollment271/actions.ts app/sysop/enrollment271/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions271.ts app/sysop/page.tsx app/workspaces/management/campgrounds/booking-recovery268/page.tsx docs/builds/BUILD271_OWNER_SOURCE_CLOSURE_REPLAY_ACCEPTANCE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/build271/core.mjs lib/build271/postgres.mjs lib/build271/postgres.d.mts tests/build271-enrollment-closure-replay.test.mjs app/api/internal/source-proof271/route.ts app/sysop/enrollment271/actions.ts app/sysop/enrollment271/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions271.ts app/sysop/page.tsx app/workspaces/management/campgrounds/booking-recovery268/page.tsx docs/builds/BUILD271_OWNER_SOURCE_CLOSURE_REPLAY_ACCEPTANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Build 271: format verified source and management screens"
            git push origin HEAD:release/build271-original-proof-closure-dev-20261121
          fi
