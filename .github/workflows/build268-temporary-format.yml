name: Build 268 temporary formatter
on:
  push:
    branches:
      - release/build268-confirmation-recovery-dev-20261120
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'RosevearCreations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Normalize source with repository formatter
        run: |
          npx prettier --write app/api/internal/support-sla268/route.ts app/sysop/recovery268/page.tsx app/sysop/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions.ts app/workspaces/management/campgrounds/booking-recovery268/page.tsx app/workspaces/management/campgrounds/operations-centre265/page.tsx lib/campground-support268/core.mjs lib/campground-support268/postgres.mjs lib/campground-support268/postgres.d.mts tests/build268-recovery.test.mjs docs/builds/BUILD268_SHELL_RECOVERY_ACCEPTANCE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/internal/support-sla268/route.ts app/sysop/recovery268/page.tsx app/sysop/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions.ts app/workspaces/management/campgrounds/booking-recovery268/page.tsx app/workspaces/management/campgrounds/operations-centre265/page.tsx lib/campground-support268/core.mjs lib/campground-support268/postgres.mjs lib/campground-support268/postgres.d.mts tests/build268-recovery.test.mjs docs/builds/BUILD268_SHELL_RECOVERY_ACCEPTANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Build 268: normalize code and review markdown to repository style"
            git push origin HEAD:release/build268-confirmation-recovery-dev-20261120
          fi
