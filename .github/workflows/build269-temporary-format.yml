name: Build 269 temporary format
on:
  push:
    branches:
      - release/build269-supervised-pilot-dev-20261121
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'RosevearCreations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Exact repository formatter
        run: |
          npx prettier --write app/api/internal/traffic269/route.ts app/api/internal/sla-delivery269/route.ts app/sysop/page.tsx app/sysop/pilot269/page.tsx app/sysop/pilot269/actions.ts app/workspaces/management/campgrounds/booking-recovery268/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions269.ts lib/campground-pilot269/core.mjs lib/campground-pilot269/postgres.mjs lib/campground-pilot269/postgres.d.mts tests/build269-pilot.test.mjs docs/builds/BUILD269_CAMP_ROSEVEAR_SUPERVISED_PILOT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/internal/traffic269/route.ts app/api/internal/sla-delivery269/route.ts app/sysop/page.tsx app/sysop/pilot269/page.tsx app/sysop/pilot269/actions.ts app/workspaces/management/campgrounds/booking-recovery268/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions269.ts lib/campground-pilot269/core.mjs lib/campground-pilot269/postgres.mjs lib/campground-pilot269/postgres.d.mts tests/build269-pilot.test.mjs docs/builds/BUILD269_CAMP_ROSEVEAR_SUPERVISED_PILOT.md
          if ! git diff --cached --quiet; then
            git commit -m "Build 269: normalize changed source with repository formatter"
            git push origin HEAD:release/build269-supervised-pilot-dev-20261121
          fi
