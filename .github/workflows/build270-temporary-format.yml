name: Build 270 temporary formatting
on:
  push:
    branches:
      - release/build270-original-host-and-owner-recovery-dev-20261121
permissions:
  contents: write
jobs:
  format:
    if: github.actor == 'RosevearCreations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - name: Format scoped Build 270 changes
        run: |
          npx prettier --write lib/build270/core.mjs lib/build270/postgres.mjs lib/build270/postgres.d.mts lib/build270/worker.mjs lib/build270/worker.d.mts tests/build270-original-host.test.mjs app/api/internal/send-sla270/route.ts app/sysop/recovery270/page.tsx app/auth/owner-access/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions270.ts app/workspaces/management/campgrounds/booking-recovery268/page.tsx app/sysop/page.tsx app/auth/login/page.tsx docs/builds/BUILD270_ORIGINAL_HOST_OWNER_COMMS_ACCEPTANCE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/build270/core.mjs lib/build270/postgres.mjs lib/build270/postgres.d.mts lib/build270/worker.mjs lib/build270/worker.d.mts tests/build270-original-host.test.mjs app/api/internal/send-sla270/route.ts app/sysop/recovery270/page.tsx app/auth/owner-access/page.tsx app/workspaces/management/campgrounds/booking-recovery268/actions270.ts app/workspaces/management/campgrounds/booking-recovery268/page.tsx app/sysop/page.tsx app/auth/login/page.tsx docs/builds/BUILD270_ORIGINAL_HOST_OWNER_COMMS_ACCEPTANCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Build 270: normalize repository style"
            git push origin HEAD:release/build270-original-host-and-owner-recovery-dev-20261121
          fi
