name: Build 194 One-Time Source Formatting
on:
  push:
    branches:
      - build194-role-aware-command-layouts
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install formatting tool
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Format reviewed Build 194 source
        run: |
          npx prettier --write \
            app/layout.tsx app/command194.css \
            app/workspaces/management/command/actions.ts \
            app/workspaces/management/command/page.tsx \
            components/management-module-finder.tsx \
            lib/command-centre/module-catalog.ts \
            lib/command-centre/layout-postgres.mjs \
            lib/command-centre/layout-postgres.d.mts \
            scripts/verify-build194-command-views.mjs \
            tests/build194-command-layouts.test.mjs \
            e2e/build194-command-privacy.spec.mjs \
            docs/BUILD_194_OPERATIONS_COMMAND_ACCEPTANCE.md \
            package.json .github/workflows/ci.yml
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/layout.tsx app/command194.css app/workspaces/management/command/actions.ts app/workspaces/management/command/page.tsx components/management-module-finder.tsx lib/command-centre/module-catalog.ts lib/command-centre/layout-postgres.mjs lib/command-centre/layout-postgres.d.mts scripts/verify-build194-command-views.mjs tests/build194-command-layouts.test.mjs e2e/build194-command-privacy.spec.mjs docs/BUILD_194_OPERATIONS_COMMAND_ACCEPTANCE.md package.json .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m "Build 194: normalize reviewed source formatting"
            git push origin HEAD:build194-role-aware-command-layouts
          fi
