# Temporary branch-only formatting step for iCamp Build 263. Removed before main.
name: iCamp Build 263 one-time formatter
on:
  push:
    branches:
      - release/icamp263-rental-sessions-financial-evidence-source-audit
permissions:
  contents: write
jobs:
  release-format:
    if: contains(github.event.head_commit.message, '[format263]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
      - name: Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Apply repository Prettier
        run: npm exec prettier -- --write .
      - name: Commit exact formatted files
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format Build 263 with canonical Prettier"
          git push origin HEAD:refs/heads/release/icamp263-rental-sessions-financial-evidence-source-audit
